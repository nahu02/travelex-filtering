name: Scrape and deploy

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Scrape travelex.si
        run: |
          pip install -r scraper/requirements.txt
          # If travelex.si is unreachable or serves an unexpected page, keep the last
          # committed data and still deploy, rather than failing the whole run.
          python scraper/scrape.py --out web/public/data \
            || echo "::warning title=Scrape failed::travelex.si could not be scraped; deploying with the previous data."

      - name: Refresh Google Maps ratings
        # Skipped (and the site simply shows no ratings) until the secret is added.
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          python -m unittest discover -s scraper
          python scraper/ratings.py --data web/public/data

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          # data.json always changes (timestamp); only commit when prices or availability moved.
          if git diff --cached --quiet -- web/public/data/events.json web/public/data/sellout.json web/public/data/ratings.json \
             && git cat-file -e HEAD:web/public/data/data.json 2>/dev/null; then
            echo "No price or availability changes."
          else
            git commit -m "data: travelex scrape $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
